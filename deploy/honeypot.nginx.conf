# Reverse-proxy del honeypot. nginx posee el socket público :8080 y emite las cabeceras de
# un web server real (nombres en Title-Case, `Server: nginx/<ver>`, `Date` propio). El backend
# ASGI (uvicorn) queda oculto; sus cabeceras `Server`/`Date` en minúscula se descartan.
server {
    listen 8080;
    server_name _;
    # server_tokens on (por defecto) -> "Server: nginx/1.27.x": banner realista y coherente.

    # nginx sirve SUS PROPIAS páginas de error 403/404 (su plantilla con "<center>nginx/1.27.x
    # </center>"), coherentes con la cabecera Server. Si no, el cuerpo de error del backend
    # llevaría otro banner y la contradicción delataría el montaje. El 401 del gate CTF NO se
    # intercepta (debe conservar su cuerpo y WWW-Authenticate).
    proxy_intercept_errors on;
    error_page 403 = @err403;
    error_page 404 = @err404;
    location @err403 { return 403; }
    location @err404 { return 404; }

    location / {
        proxy_pass http://moqesh-ai:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # IP real del atacante: se REEMPLAZA cualquier X-Forwarded-For entrante por el peer real
        # (no spoofable). El honeypot lee la IP de origen de esta cabecera.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # El backend emite Server/Date en minúscula (uvicorn/ASGI); los ocultamos para que nginx
        # ponga los suyos en Title-Case y no haya cabeceras duplicadas ni incoherentes.
        proxy_hide_header Server;
        proxy_hide_header Date;

        # uvicorn baja a minúscula los nombres de cabecera; nginx los reenvía tal cual. Para que
        # un fichero NO tenga unos headers Title-Case (los de nginx) y otros en minúscula (los del
        # backend), ocultamos los del upstream y los re-emitimos con el nombre canónico. El valor
        # se toma del upstream; si viene vacío (p.ej. un listado sin ETag), nginx no añade la
        # cabecera, así que no aparecen cabeceras vacías.
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Accept-Ranges;
        proxy_hide_header Content-Disposition;
        proxy_hide_header WWW-Authenticate;
        add_header ETag                $upstream_http_etag;
        add_header Last-Modified       $upstream_http_last_modified;
        add_header Accept-Ranges       $upstream_http_accept_ranges;
        add_header Content-Disposition $upstream_http_content_disposition;
        add_header WWW-Authenticate    $upstream_http_www_authenticate always;
    }
}
