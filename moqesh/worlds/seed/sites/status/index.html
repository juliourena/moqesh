<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harborline Status</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;font:15px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2430;background:#f6f7f9}
  header{background:#0f1115;color:#fff;padding:22px 24px}
  main{max-width:760px;margin:24px auto;padding:0 24px}
  .row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px 16px;margin-bottom:8px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}
  .ok{background:#16a34a} .deg{background:#d97706}
  .state{font-size:13px;color:#6b7280}
  .banner{background:#e7f6ec;border:1px solid #bbe7c9;color:#166534;border-radius:8px;padding:12px 16px;margin-bottom:16px}
</style>
</head>
<body>
<header><strong>Harborline Status</strong> — operational</header>
<main>
  <div class="banner">All core systems operational. Last updated {{moqesh.minutes_ago}} minutes ago.</div>
  <div class="row"><span><span class="dot ok"></span>API Gateway</span><span class="state">operational</span></div>
  <div class="row"><span><span class="dot ok"></span>Billing</span><span class="state">operational</span></div>
  <div class="row"><span><span class="dot ok"></span>Authentication</span><span class="state">operational</span></div>
  <div class="row"><span><span class="dot deg"></span>Reporting</span><span class="state">degraded performance</span></div>
  <div class="row"><span><span class="dot ok"></span>Notifications</span><span class="state">operational</span></div>
  <p style="color:#6b7280;font-size:13px">Machine-readable summary: <a href="/status/api/summary.json">summary.json</a></p>
</main>
</body>
</html>
